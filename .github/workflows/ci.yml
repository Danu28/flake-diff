name: CI
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '11', distribution: 'temurin', cache: 'maven' }
      - name: Build flake-snapshot lib
        run: mvn -f flake-diff/pom.xml verify -q
      - name: Run sample Selenium (headless)
        run: mvn -f sample-selenium/pom.xml test -Dheadless=true -q
      - name: Snapshot quality gate (<2s, no browser)
        run: python scripts/quality.py
      - name: Verify snapshots exist (CI generated)
        run: ls -lh sample-selenium/target/snapshots/ || ls -lh target/snapshots/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: snapshots, path: sample-selenium/target/snapshots }
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint extension + quality
        run: |
          python -c "import json; json.load(open('flake-diff/extension/manifest.json')); print('manifest ok')"
          node --check flake-diff/extension/app.js && echo "app.js syntax ok"
          test -f flake-diff/extension/icon128.png && echo "icons ok"
          python scripts/quality.py && echo "quality ok"
