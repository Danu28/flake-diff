<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flake Diff</title>
<style>
  *{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
  body{margin:0;width:320px;background:#f8fafc;color:#0f172a}
  .wrap{padding:16px}
  h1{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
  p{margin:0 0 14px;color:#64748b;font-size:12px;line-height:1.4}
  .btn{width:100%;padding:11px;border-radius:10px;border:0;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:linear-gradient(180deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35)}
  .btn-primary:hover{background:#4338ca}
  .btn-ghost{margin-top:8px;background:#fff;border:1px solid #e2e8f0;color:#334155}
  .hint{margin-top:10px;font-size:11px;color:#94a3b8;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 3l7 4v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V7l7-4z"/><path d="M9 12l2 2 4-4"/></svg> Flake Diff</h1>
  <p>Popup is compact. Open full page for the complete diff view (980px, 6 cards, verdict hero).</p>
  <button id="openFull" class="btn btn-primary">Open Full Page ↗</button>
  <button id="openDemo" class="btn btn-ghost">Open Full Page with Demo</button>
  <div class="hint">Also works as <span style="font-family:monospace">file://</span> — open <b>app.html</b> directly.</div>
</div>
<script src="popup.js"></script>
</body>
</html>
